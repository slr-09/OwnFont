name: CD

on:
  push:
    tags:
      - "v*"

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "latest"
          bundler-cache: false

      - name: Install dependencies
        run: bundle install

      - name: Install certificate
        run: |
          echo "${{ secrets.CERT_P12_BASE64 }}" | base64 --decode > cert.p12
          security create-keychain -p "fastlane_tmp" fastlane_tmp.keychain
          security default-keychain -s fastlane_tmp.keychain
          security unlock-keychain -p "fastlane_tmp" fastlane_tmp.keychain
          security import cert.p12 -k fastlane_tmp.keychain -P "${{ secrets.CERT_P12_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "fastlane_tmp" fastlane_tmp.keychain

      - name: Install provisioning profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -)
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          echo "PROFILE_UUID=${PROFILE_UUID}" >> $GITHUB_ENV

      - name: Write GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > OwnFont/GoogleService-Info.plist

      - name: Upload to TestFlight
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: bundle exec fastlane beta

      - name: Dump gym build log on failure
        if: failure()
        run: |
          echo "===== gym build log ====="
          cat ~/Library/Logs/gym/OwnFont-OwnFont.log || echo "no gym log"
          echo "===== xcodebuild error lines ====="
          grep -nE "error:|❌|Code Sign|provisioning|No profile|No signing" ~/Library/Logs/gym/OwnFont-OwnFont.log || true
