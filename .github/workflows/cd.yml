name: CD

on:
  push:
    tags:
      - "v*"

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "latest"
          bundler-cache: false

      - name: Install dependencies
        run: bundle install

      - name: Decode certificate
        run: |
          echo "${{ secrets.CERT_P12_BASE64 }}" | base64 --decode > cert.p12

      - name: Decode provisioning profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision

      - name: Write ASC API key
        run: |
          cat > fastlane/asc_api_key.json <<EOF
          {
            "key_id": "${{ secrets.ASC_API_KEY_ID }}",
            "issuer_id": "${{ secrets.ASC_API_ISSUER_ID }}",
            "key_content": "${{ secrets.ASC_API_KEY_CONTENT }}",
            "in_house": false
          }
          EOF

      - name: Upload to TestFlight
        env:
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane beta
